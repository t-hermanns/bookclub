services:
  bookclub:
    build: .
    image: bookclub:latest
    container_name: bookclub
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Required; the stack refuses to start without them (see README → Configuration).
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET must be set}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      - PARTICIPANTS=${PARTICIPANTS:?PARTICIPANTS must be set}
      - ADMIN_NAME=${ADMIN_NAME:?ADMIN_NAME must be set}
      # Voting system for new rounds: single (1 vote) or three_votes (3 votes per person)
      - VOTING_SYSTEM=${VOTING_SYSTEM:-single}
    volumes:
      # SQLite database (incl. -wal/-shm) in a named volume
      - bookclub_data:/app/data
    healthcheck:
      # Node instead of wget (not in the slim image); 127.0.0.1 because localhost may resolve
      # to ::1 while the server only listens on IPv4 (0.0.0.0).
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/', (res) => res.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  bookclub_data:
