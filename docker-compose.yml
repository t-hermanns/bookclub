services:
  bookclub:
    build: .
    image: bookclub:latest
    container_name: bookclub
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET muss gesetzt sein}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me}
      # Abstimmungssystem für neue Runden: single (1 Stimme) oder three_votes (3 Stimmen)
      - VOTING_SYSTEM=${VOTING_SYSTEM:-single}
    volumes:
      # SQLite-Datenbank (inkl. -wal/-shm) im Named Volume; Backup siehe README.
      - bookclub_data:/app/data
    healthcheck:
      # Node-Skript statt wget (im Slim-Image nicht vorhanden); 127.0.0.1 statt localhost, weil localhost
      # auf ::1 auflösen kann, der Server aber nur auf IPv4 (0.0.0.0) lauscht.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/', (res) => res.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  bookclub_data:
