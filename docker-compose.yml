services:
  bookclub:
    build: .
    image: bookclub:latest
    container_name: bookclub
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET muss gesetzt sein}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me}
    volumes:
      # ÄNDERUNG HIER: Statt ./data nutzen wir ein Named Volume
      - bookclub_data:/app/data
    healthcheck:
      # Wir nutzen ein winziges Node-Skript statt wget. Das funktioniert immer und umgeht wget/localhost-Bugs.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/', (res) => res.statusCode === 200 ? process.exit(0) : process.exit(1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5

# NEUER BLOCK GANZ UNTEN:
volumes:
  bookclub_data:
